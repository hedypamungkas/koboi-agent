name: Docker

# Build & push the koboi server image to the GitHub Container Registry (ghcr.io).
#   - On PR (Dockerfile-relevant paths): build-only (no push) so Dockerfile
#     regressions are caught before a release.
#   - On tag v*: build an amd64 tar -> Trivy scan (fail on fixable HIGH/CRITICAL)
#     -> multi-arch (amd64 + arm64) push. Semver tags; `latest` only on
#     non-prereleases. Scanning before push prevents shipping a known-vulnerable
#     image (the image is published only if the scan passes).
# Public image; no secrets beyond the default GITHUB_TOKEN (packages: write).

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "examples/docker/**"
      - "koboi/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels (semver; latest only on non-prerelease)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Scan target: a classic docker-format tar (manifest.json at root) so Trivy
      # can read it via --input. type=oci + provenance=true (the build-push-action
      # v7 default) exports a manifest-list/index artifact that Trivy rejects with
      # "manifest.json not found in tar" — so use type=docker with provenance
      # disabled for a deterministic single-image tar.
      - name: Build amd64 image to docker tar (scan target; not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (fail on fixable HIGH/CRITICAL)
        # ignore-unfixed: only block when a fix is available; unfixable findings
        # still appear in the scan log but don't gate the release. Drop the flag
        # to fail on all HIGH/CRITICAL regardless of fix availability.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  docker-build:
    # PR guard: build the Dockerfile (no push) so regressions are caught pre-release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
